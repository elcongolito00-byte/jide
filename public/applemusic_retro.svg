<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152d5e"/>
      <stop offset="100%" stop-color="#091628"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#070f1e"/>

  <!-- Card -->
  <rect x="40" y="40" width="320" height="320" rx="48" fill="url(#cardGrad)" stroke="#1e4080" stroke-width="2"/>
  <rect x="40" y="40" width="320" height="160" rx="48" fill="url(#shineGrad)"/>

  <!-- Rivet dots -->
  <circle cx="72" cy="72" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="328" cy="72" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="72" cy="328" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="328" cy="328" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>

  <!-- Inner border -->
  <rect x="52" y="52" width="296" height="296" rx="40" fill="none" stroke="#1a3a7a" stroke-width="1"/>

  <!-- Outer circle frame -->
  <circle cx="200" cy="210" r="104" fill="#0a1628" stroke="#1e4a90" stroke-width="2"/>
  <circle cx="200" cy="210" r="96" fill="#091220" stroke="#162d5a" stroke-width="1"/>

  <!-- CD rings inside -->
  <circle cx="200" cy="210" r="88" fill="none" stroke="#132040" stroke-width="1"/>
  <circle cx="200" cy="210" r="76" fill="none" stroke="#0f1a35" stroke-width="1"/>

  <!-- Inner disc -->
  <circle cx="200" cy="210" r="64" fill="#0d1f3c" stroke="#1e4a90" stroke-width="1.5"/>

  <!-- Music note double quaver - larger, centered -->
  <!-- Left stem -->
  <line x1="181" y1="183" x2="181" y2="225" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  <!-- Right stem -->
  <line x1="219" y1="174" x2="219" y2="216" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  <!-- Beam -->
  <line x1="181" y1="183" x2="219" y2="174" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  <!-- Left note head -->
  <ellipse cx="177" cy="228" rx="16" ry="10" fill="white" transform="rotate(-18 177 228)" opacity="0.95"/>
  <!-- Right note head -->
  <ellipse cx="215" cy="219" rx="16" ry="10" fill="white" transform="rotate(-18 215 219)" opacity="0.9"/>

  <!-- Star accents -->
  <text x="120" y="185" font-family="Arial" font-size="18" fill="#1e4080">✦</text>
  <text x="266" y="178" font-family="Arial" font-size="18" fill="#1e4080">✦</text>
  <text x="120" y="248" font-family="Arial" font-size="14" fill="#162d5a">✦</text>
  <text x="270" y="244" font-family="Arial" font-size="14" fill="#162d5a">✦</text>

  <!-- Center hole on outer ring -->
  <circle cx="200" cy="210" r="10" fill="#070f1e" stroke="#162d5a" stroke-width="1.5"/>

  <!-- Brand strip -->
  <rect x="108" y="100" width="184" height="22" rx="5" fill="#0d1f3c" stroke="#1e4a90" stroke-width="1.2"/>
  <text x="200" y="115" text-anchor="middle" font-family="'Arial Black', Arial" font-size="9" font-weight="900" fill="white" opacity="0.9" letter-spacing="2">APPLE MUSIC</text>

  <!-- Bottom label -->
  <text x="200" y="348" text-anchor="middle" font-family="'Arial Black', Arial" font-size="13" font-weight="900" fill="#3a6ab8" letter-spacing="4">TUNES</text>
</svg>
