<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152d5e"/>
      <stop offset="100%" stop-color="#091628"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cloudClip">
      <rect x="78" y="140" width="244" height="140"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#070f1e"/>

  <!-- Card -->
  <rect x="40" y="40" width="320" height="320" rx="48" fill="url(#cardGrad)" stroke="#1e4080" stroke-width="2"/>
  <rect x="40" y="40" width="320" height="160" rx="48" fill="url(#shineGrad)"/>

  <!-- Rivet dots -->
  <circle cx="72" cy="72" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="328" cy="72" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="72" cy="328" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="328" cy="328" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>

  <!-- Inner border -->
  <rect x="52" y="52" width="296" height="296" rx="40" fill="none" stroke="#1a3a7a" stroke-width="1"/>

  <!-- Cloud body - layered circles forming cloud shape -->
  <circle cx="138" cy="192" r="38" fill="#0a1628" stroke="#1e4a90" stroke-width="2"/>
  <circle cx="172" cy="170" r="50" fill="#0a1628" stroke="#1e4a90" stroke-width="2"/>
  <circle cx="220" cy="176" r="44" fill="#0a1628" stroke="#1e4a90" stroke-width="2"/>
  <circle cx="262" cy="186" r="34" fill="#0a1628" stroke="#1e4a90" stroke-width="2"/>
  <!-- Cloud floor -->
  <rect x="100" y="195" width="196" height="50" rx="0" fill="#0a1628"/>
  <rect x="100" y="220" width="196" height="28" rx="14" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>

  <!-- Waveform bars clipped to cloud shape -->
  <g clip-path="url(#cloudClip)">
    <rect x="110" y="185" width="14" height="62" rx="7" fill="white" opacity="0.9"/>
    <rect x="130" y="172" width="14" height="76" rx="7" fill="white" opacity="0.85"/>
    <rect x="150" y="162" width="14" height="86" rx="7" fill="white" opacity="0.9"/>
    <rect x="170" y="170" width="14" height="78" rx="7" fill="white" opacity="0.85"/>
    <rect x="190" y="158" width="14" height="90" rx="7" fill="white" opacity="0.9"/>
    <rect x="210" y="167" width="14" height="81" rx="7" fill="white" opacity="0.85"/>
    <rect x="230" y="175" width="14" height="73" rx="7" fill="white" opacity="0.9"/>
    <rect x="250" y="182" width="14" height="66" rx="7" fill="white" opacity="0.85"/>
    <rect x="270" y="190" width="14" height="58" rx="7" fill="white" opacity="0.8"/>
  </g>

  <!-- Brand strip -->
  <rect x="108" y="100" width="184" height="22" rx="5" fill="#0d1f3c" stroke="#1e4a90" stroke-width="1.2"/>
  <text x="200" y="115" text-anchor="middle" font-family="'Arial Black', Arial" font-size="10" font-weight="900" fill="white" opacity="0.9" letter-spacing="2">SOUNDCLOUD</text>

  <!-- Signal arc decorations -->
  <path d="M152 290 Q200 282 248 290" fill="none" stroke="#1e4080" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M168 300 Q200 294 232 300" fill="none" stroke="#1a3a7a" stroke-width="1" stroke-linecap="round"/>

  <!-- Bottom label -->
  <text x="200" y="348" text-anchor="middle" font-family="'Arial Black', Arial" font-size="13" font-weight="900" fill="#3a6ab8" letter-spacing="4">AUDIO</text>
</svg>
