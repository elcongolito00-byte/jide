<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152d5e"/>
      <stop offset="100%" stop-color="#091628"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="innerglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#070f1e"/>

  <!-- Card -->
  <rect x="40" y="40" width="320" height="320" rx="48" fill="url(#cardGrad)" stroke="#1e4080" stroke-width="2"/>
  <!-- Top shine -->
  <rect x="40" y="40" width="320" height="160" rx="48" fill="url(#shineGrad)"/>

  <!-- Rivet dots - retro hardware corners -->
  <circle cx="72" cy="72" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="328" cy="72" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="72" cy="328" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>
  <circle cx="328" cy="328" r="6" fill="#0a1628" stroke="#1e4a90" stroke-width="1.5"/>

  <!-- Inner border glow -->
  <rect x="52" y="52" width="296" height="296" rx="40" fill="none" stroke="#1a3a7a" stroke-width="1"/>

  <!-- TV screen shape -->
  <rect x="90" y="135" width="220" height="148" rx="28" fill="#0a1628" stroke="#1e4a90" stroke-width="2"/>
  <!-- Screen inner -->
  <rect x="100" y="145" width="200" height="128" rx="20" fill="#091220" stroke="#162d5a" stroke-width="1"/>

  <!-- Play button -->
  <polygon points="162,183 162,247 254,215" fill="white" opacity="0.95"/>
  <!-- Play button inner highlight -->
  <polygon points="162,183 162,210 226,198" fill="white" opacity="0.25"/>

  <!-- Brand name top strip -->
  <rect x="130" y="108" width="140" height="24" rx="6" fill="#0d1f3c" stroke="#1e4a90" stroke-width="1.2"/>
  <text x="200" y="124" text-anchor="middle" font-family="'Arial Black', Arial" font-size="11" font-weight="900" fill="white" opacity="0.9" letter-spacing="3">YOUTUBE</text>

  <!-- Channel dots row bottom -->
  <circle cx="170" cy="296" r="5" fill="#0d1f3c" stroke="#1e4080" stroke-width="1.5"/>
  <circle cx="190" cy="296" r="5" fill="#1a3a7a" stroke="#2a5ab0" stroke-width="1.5"/>
  <circle cx="210" cy="296" r="5" fill="#0d1f3c" stroke="#1e4080" stroke-width="1.5"/>
  <circle cx="230" cy="296" r="5" fill="#0d1f3c" stroke="#1e4080" stroke-width="1.5"/>

  <!-- Bottom label -->
  <text x="200" y="348" text-anchor="middle" font-family="'Arial Black', Arial" font-size="13" font-weight="900" fill="#3a6ab8" letter-spacing="4">VIDEO</text>
</svg>
